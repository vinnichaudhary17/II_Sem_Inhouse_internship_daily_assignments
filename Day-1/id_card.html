<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinni Chaudhary</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .profile-header {
            text-align: center;
        }
        .profile-header h1 {
            color: #333;
            margin: 10px 0;
        }
        .profile-header img {
            border-radius: 50%;
            width: 250px;
            height: 250px;
            object-fit: cover;
            border: 3px solid #ddd;
        }
        hr {
            margin: 20px 0;
            border: none;
            border-top: 1px solid #ddd;
        }
        a {
            color: #007bff;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        ul, ol {
            margin-left: 20px;
        }
        li {
            margin: 8px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-header">
            <h1>Vinni Chaudhary</h1>
             <img src="vinni.jpeg" alt="Vikash Bhargav Profile Picture"> 
        </div>

        <hr>

        <p><strong>About Me</strong></p>
        <p>I am learning web development</p>

        <hr>

        <p><strong>Skills</strong></p>
        <ul>
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
        </ul>

        <hr>

        <p><strong>Interests</strong></p>
        <ol>
            <li>Gaming</li>
            <li>Eating</li>
            <li>Sleeping</li>
        </ol>
    </div>
</body>
